services:
  mediavault:
    build: .
    image: mediavault:latest
    container_name: mediavault
    restart: unless-stopped

    # Traefik (which runs on host network on this VPS) will reach this
    # container via its bridge-network IP on port 3001. No ports: mapping
    # is needed — traefik labels below are enough.
    expose:
      - "3001"

    # Use external DNS servers directly. Docker's embedded resolver
    # (127.0.0.11 → host systemd-resolved) can be flaky under sustained
    # load — IPTV streams do thousands of DNS lookups per minute against
    # ephemeral CDN URLs, which exposes the flakiness.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - PORT=3001
      # Node 17+ defaults to verbatim DNS ordering which can flake on
      # IPv4-only IPTV hosts when the resolver returns AAAA first.
      - NODE_OPTIONS=--dns-result-order=ipv4first

    # Hard-coded fallback for the Xtream API host so a transient DNS
    # blip never kills a live stream. Update this IP if the provider
    # ever moves: getent hosts spliffstar.ottb.xyz on the host.
    extra_hosts:
      - "spliffstar.ottb.xyz:107.189.14.157"

    volumes:
      # SQLite + subtitle cache persistence
      - mediavault-db:/app/server/db
      # Seedbox SSH key from the host (read-only). Mount point matches the
      # SEEDBOX_KEY_PATH value set in .env below.
      - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mediavault.rule=Host(`media.baseinthe.cloud`)"
      - "traefik.http.routers.mediavault.entrypoints=websecure"
      - "traefik.http.routers.mediavault.tls.certresolver=letsencrypt"
      - "traefik.http.services.mediavault.loadbalancer.server.port=3001"
      # Streaming: flush proxy writes every 100ms so FFmpeg pipe output reaches
      # the browser in real time. Do NOT add Traefik's "buffering" middleware —
      # it buffers the full response before forwarding, which deadlocks a live
      # fMP4 stream (0 bytes ever reach the client).
      - "traefik.http.services.mediavault.loadbalancer.responseforwarding.flushinterval=100ms"

volumes:
  mediavault-db:
